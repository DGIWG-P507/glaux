    <text x="70" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">Native STANAG 4789</text>
    <text x="70" y="107" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#64748b" text-anchor="middle">Data Generator</text>
    <g transform="translate(56, -10)">
      <rect width="28" height="18" rx="4" fill="#38bdf8" />
      <text x="14" y="13" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">#4</text>
    </g>
