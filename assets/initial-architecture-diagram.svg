      <text x="14" y="13" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">#6</text>
    </g>
  </g>

  <!-- glaux-mobile (#5) -->
  <g transform="translate(710, 360)" filter="url(#shadow)">
    <rect width="160" height="90" rx="6" fill="url(#comp-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="160" height="24" rx="4" fill="#0c4a6e" opacity="0.6" />
    <text x="80" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">TACTICAL EDGE FIELD APP</text>
    <text x="80" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">glaux-mobile</text>
    <text x="80" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">Tactical Coproduction Client</text>
    <g transform="translate(66, -10)">
