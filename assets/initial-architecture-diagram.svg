<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Component Box Gradient -->
    <linearGradient id="comp-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Core Server Drop Shadow / Glow -->
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Standard Component Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Deep Slate Presentation Canvas Background -->
  <rect width="960" height="540" fill="url(#bg-grad)" />

  <!-- Grid Overlay Layer for Technical Depth -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <path d="M 0,90 L 960,90 M 0,180 L 960,180 M 0,270 L 960,270 M 0,360 L 960,360 M 0,450 L 960,450" />
    <path d="M 160,0 L 160,540 M 320,0 L 320,540 M 480,0 L 480,540 M 640,0 L 640,540 M 800,0 L 800,540" />
  </g>

  <!-- HEADER BLOCK -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc" letter-spacing="1">DGIWG GLAUX ECOSYSTEM</text>
    <text x="0" y="22" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#38bdf8" letter-spacing="0.5">Notional Architecture Deployment Variant (STANAG 4789 / OGC API - Connected Systems)</text>
    <line x1="0" y1="35" x2="880" y2="35" stroke="#334155" stroke-width="1" />
  </g>

  <!-- LAYER BOUNDARY LABELS -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.5">
    <text x="145" y="125" text-anchor="middle">INGESTION &amp; SIMULATION</text>
    <text x="480" y="125" text-anchor="middle">CORE DISSEMINATION SERVICES</text>
    <text x="815" y="125" text-anchor="middle">TACTICAL CONSUMERS &amp; EDGE CLIENTS</text>
  </g>

  <!-- LINKAGE & CONNECTIONS LAYER (Z-INDEX BOTTOM) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Simulator -> Core Server Line -->
    <path d="M 230,205 L 360,205" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" />
    <polygon points="360,205 352,200 352,210" fill="#38bdf8" />

    <!-- Legacy Feeds -> Publisher Line -->
    <path d="M 115,360 L 150,360" stroke="#64748b" stroke-width="2" />
    <polygon points="150,360 144,356 144,364" fill="#64748b" />

    <!-- Publisher -> Core Server Line -->
    <path d="M 230,385 L 290,385 L 290,265 L 360,265" stroke="#34d399" stroke-width="2.5" />
    <polygon points="360,265 352,260 352,270" fill="#34d399" />

    <!-- Core Server -> Web App Line -->
    <path d="M 600,205 L 730,205" stroke="#38bdf8" stroke-width="2.5" />
    <polygon points="730,205 722,200 722,210" fill="#38bdf8" />

    <!-- Core Server -> Mobile App Line -->
    <path d="M 600,265 L 670,265 L 670,385 L 730,385" stroke="#38bdf8" stroke-width="2.5" />
    <polygon points="730,385 722,380 722,390" fill="#38bdf8" />
  </g>

  <!-- INGESTION & SIMULATION NODE LAYER -->
  <!-- External Legacy Data Sources Base -->
  <g transform="translate(45, 310)" filter="url(#shadow)">
    <rect width="70" height="100" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="35" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">LEGACY</text>
    <text x="35" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">FEEDS</text>
    <text x="35" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#64748b" text-anchor="middle">(Non-Standard)</text>
  </g>

  <!-- glaux-publisher -->
  <g transform="translate(150, 325)" filter="url(#shadow)">
    <rect width="80" height="120" rx="6" fill="url(#comp-grad)" stroke="#10b981" stroke-width="1.5" />
    <rect width="80" height="28" rx="4" fill="#042f2e" opacity="0.6" />
    <text x="40" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="0.5">PUBLISHER</text>
    <text x="40" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">glaux-</text>
    <text x="40" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">publisher</text>
    <text x="40" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">Data Translation</text>
    <text x="40" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">&amp; Normalization</text>
  </g>

  <!-- glaux-simulator -->
  <g transform="translate(90, 145)" filter="url(#shadow)">
    <rect width="140" height="120" rx="6" fill="url(#comp-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="140" height="28" rx="4" fill="#0c4a6e" opacity="0.6" />
    <text x="70" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">SIMULATION ENGINE</text>
    <text x="70" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">glaux-simulator</text>
    <text x="70" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">Native STANAG 4789</text>
    <text x="70" y="107" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">Telemetry Generator</text>
  </g>


  <!-- CORE INFRASTRUCTURE SERVICES LAYER (CENTER NODE) -->
  <!-- glaux-server (Engine Node) -->
  <g transform="translate(360, 145)" filter="url(#core-glow)">
    <rect width="240" height="300" rx="8" fill="url(#comp-grad)" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Top Accent Bar -->
    <path d="M 362 153 A 6 6 0 0 1 368 147 L 592 147 A 6 6 0 0 1 598 153 L 598 185 L 362 185 Z" fill="#0c4a6e" />
    <text x="120" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">CORE REFERENCE SERVER</text>
    
    <!-- Large Component Moniker -->
    <text x="120" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">glaux-server</text>
    
    <!-- Interface Protocol Framework Badges -->
    <g transform="translate(20, 110)">
      <rect width="200" height="32" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="100" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">OGC API - Connected Systems</text>
    </g>
    <g transform="translate(20, 150)">
      <rect width="200" height="32" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="100" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">NATO STANAG 4789 Baseline</text>
    </g>

    <!-- Sub-Component Functional Blocks Internal to Server -->
    <g transform="translate(20, 205)" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">
      <rect width="95" height="40" rx="4" fill="#0f172a" stroke="#1e293b" />
      <text x="47" y="20" text-anchor="middle">Discovery &amp;</text>
      <text x="47" y="32" text-anchor="middle">Registration</text>

      <rect width="95" height="40" rx="4" x="105" fill="#0f172a" stroke="#1e293b" />
      <text x="152" y="20" text-anchor="middle">Dynamic Data</text>
      <text x="152" y="32" text-anchor="middle">Dissemination</text>

      <rect width="200" height="30" rx="4" y="50" fill="#0f172a" stroke="#1e293b" />
      <text x="100" y="69" text-anchor="middle" font-weight="700" fill="#38bdf8">Sensor Tasking &amp; Control Plane</text>
    </g>
  </g>


  <!-- OPERATIONAL APP LAYER -->
  <!-- glaux-webapp -->
  <g transform="translate(730, 145)" filter="url(#shadow)">
    <rect width="140" height="120" rx="6" fill="url(#comp-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="140" height="28" rx="4" fill="#0c4a6e" opacity="0.6" />
    <text x="70" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">COMMAND DASHBOARD</text>
    <text x="70" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">glaux-webapp</text>
    <text x="70" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">Web Management UI &amp;</text>
    <text x="70" y="107" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">Situational Awareness</text>
  </g>

  <!-- glaux-mobile -->
  <g transform="translate(730, 325)" filter="url(#shadow)">
    <rect width="140" height="120" rx="6" fill="url(#comp-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="140" height="28" rx="4" fill="#0c4a6e" opacity="0.6" />
    <text x="70" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">TACTICAL EDGE FIELD APP</text>
    <text x="70" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">glaux-mobile</text>
    <text x="70" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">Cross-Platform Mobile</text>
    <text x="70" y="107" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">Deployment Client (iOS/Android)</text>
  </g>


  <!-- OVERARCHING GLOBAL MANAGEMENT MATRIX -->
  <!-- Shifted container to X=30 to eliminate edge cutoff, expanded label badge to width=290 to comfortably fit text -->
  <g transform="translate(30, 95)">
    <rect width="900" height="415" rx="8" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,4" />
    <rect width="290" height="24" rx="4" x="25" y="-12" fill="#334155" />
    <text x="170" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.75">SYSTEM META-REPO FRAMEWORK: glaux</text>
  </g>

  <!-- FOOTER ORCHESTRATION LEGEND -->
  <g transform="translate(40, 485)" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b">
    <circle cx="10" cy="5" r="4" fill="#38bdf8" />
    <text x="22" y="9">Native OGC API Ecosystem Interoperability Protocol</text>

    <circle cx="340" cy="5" r="4" fill="#34d399" />
    <text x="352" y="9">Normalized STANAG 4789 Data Stream</text>

    <circle cx="630" cy="5" r="4" fill="#475569" />
    <text x="642" y="9">Bespoke Non-Standard / Legacy Ingestion</text>
  </g>

</svg>
