    <rect width="80" height="150" rx="8" fill="#090d16" stroke="#475569" stroke-width="1.5" />
    
    <!-- Abstract Stylized Human Interface Token Icon -->
    <g fill="#cbd5e1" stroke="#475569" stroke-width="1">
      <circle cx="40" cy="45" r="14" fill="#475569" />
      <path d="M 20,80 C 20,65 30,65 40,65 C 50,65 60,65 60,80 L 60,95 L 20,95 Z" fill="#475569" />
    </g>
    
    <!-- Structural Vector Description Labels -->
    <text x="40" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle">HUMAN</text>
    <text x="40" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">OPERATORS</text>
    <text x="40" y="137" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500" fill="#64748b" text-anchor="middle">Coalition Edge</text>
