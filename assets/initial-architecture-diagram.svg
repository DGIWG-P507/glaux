  <g transform="translate(325, 135)" filter="url(#core-glow)">
    <rect width="240" height="310" rx="8" fill="url(#comp-grad)" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 327 143 A 6 6 0 0 1 333 137 L 557 137 A 6 6 0 0 1 563 143 L 563 175 L 327 175 Z" fill="#0c4a6e" />
    <text x="120" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">CORE REFERENCE SERVER</text>
    <text x="120" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">glaux-server</text>
    
    <g transform="translate(20, 105)">
      <rect width="200" height="30" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="100" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">OGC API - Connected Systems</text>
    </g>
    <g transform="translate(20, 142)">
      <rect width="200" height="30" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="100" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">NATO STANAG 4789 Baseline</text>
    </g>
    <g transform="translate(20, 195)" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">
      <rect width="95" height="40" rx="4" fill="#0f172a" stroke="#1e293b" />
      <text x="47" y="20" text-anchor="middle">Discovery &amp;</text>
      <text x="47" y="32" text-anchor="middle">Registration</text>

      <rect width="95" height="40" rx="4" x="105" fill="#0f172a" stroke="#1e293b" />
      <text x="152" y="20" text-anchor="middle">Dynamic Data</text>
      <text x="152" y="32" text-anchor="middle">Dissemination</text>

      <rect width="200" height="30" rx="4" y="52" fill="#0f172a" stroke="#1e293b" />
      <text x="100" y="71" text-anchor="middle" font-weight="700" fill="#38bdf8">Sensor Tasking &amp; Control Plane</text>
    </g>
    <g transform="translate(106, -10)">
      <rect width="28" height="18" rx="4" fill="#38bdf8" />
      <text x="14" y="13" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">#1</text>
    </g>
  </g>

  <!-- APPS & COGNITIVE CONSUMER SERVICES MATRIX -->
  <!-- glaux-webapp (#2) -->
  <g transform="translate(710, 135)" filter="url(#shadow)">
    <rect width="160" height="90" rx="6" fill="url(#comp-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="160" height="24" rx="4" fill="#0c4a6e" opacity="0.6" />
    <text x="80" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">COMMAND DASHBOARD</text>
    <text x="80" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">glaux-webapp</text>
    <text x="80" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">Visual Coproduction Layer</text>
    <g transform="translate(66, -10)">
      <rect width="28" height="18" rx="4" fill="#38bdf8" />
      <text x="14" y="13" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">#2</text>
    </g>
  </g>

  <!-- glaux-agent (#6 - INTEGRATED COGNITIVE ASSET) -->
  <g transform="translate(710, 245)" filter="url(#shadow)">
    <rect width="160" height="95" rx="6" fill="url(#comp-grad)" stroke="#22d3ee" stroke-width="1.5" />
    <rect width="160" height="24" rx="4" fill="#155e75" opacity="0.6" />
    <text x="80" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#22d3ee" text-anchor="middle" letter-spacing="0.5">INTELLIGENT LLM CONSUMER</text>
    <text x="80" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">glaux-agent</text>
    <text x="80" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#a5f3fc" text-anchor="middle">Conversational Interlocking</text>
    <text x="80" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500" fill="#64748b" text-anchor="middle">Contextual API Coprocessor</text>
    <g transform="translate(66, -10)">
