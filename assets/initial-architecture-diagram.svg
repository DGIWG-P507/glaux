  <!-- FOOTER DIAGRAM CAPTION LEGEND MATRIX -->
  <g transform="translate(40, 492)" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#64748b">
    <circle cx="10" cy="5" r="4" fill="#38bdf8" />
    <text x="22" y="9">Native CSAPI Standard Broker Flow (Core API Datastreams)</text>

    <circle cx="310" cy="5" r="4" fill="#a5f3fc" />
