<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Component Box Gradient -->
    <linearGradient id="comp-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Core Server Glow -->
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Standard Component Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1060" height="540" fill="url(#bg-grad)" />

  <!-- Grid Overlay Layer -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <path d="M 0,90 L 1060,90 M 0,270 L 1060,270 M 0,450 L 1060,450" />
    <path d="M 160,0 L 160,540 M 320,0 L 320,540 M 480,0 L 480,540 M 640,0 L 640,540 M 800,0 L 800,540 M 940,0 L 940,540" />
  </g>

  <!-- HEADER COMPOSITION -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f8fafc" letter-spacing="1">DGIWG GLAUX ECOSYSTEM</text>
    <text x="0" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#38bdf8" letter-spacing="0.5">Ecosystem Interfacing, Consumer Coproduction, and Human-in-the-Loop Architecture</text>
    <line x1="0" y1="35" x2="980" y2="35" stroke="#334155" stroke-width="1" />
  </g>

  <!-- LAYER BOUNDARY LABELS -->
  <g font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.5">
    <text x="145" y="115" text-anchor="middle">INGESTION &amp; SIMULATION</text>
    <text x="445" y="115" text-anchor="middle">CORE DISSEMINATION SERVICES</text>
    <text x="795" y="115" text-anchor="middle">INTERACTION &amp; COGNITIVE LAYER</text>
    <text x="980" y="115" text-anchor="middle">OPERATIONAL EDGE</text>
  </g>

  <!-- SYSTEM OVERARCHING BOUNDARY ENVELOPE (EXTENDED) -->
  <g transform="translate(30, 95)">
    <rect width="900" height="375" rx="8" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,4" />
    <rect width="290" height="24" rx="4" x="25" y="-12" fill="#334155" />
    <text x="170" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.75">SYSTEM META-REPO FRAMEWORK: glaux</text>
  </g>

  <!-- PIPELINES & ROUTING LINKS (Z-INDEX BOTTOM) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Simulator -> Core Server -->
    <path d="M 230,195 L 325,195" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" />
    <polygon points="325,195 317,190 317,200" fill="#38bdf8" />

    <!-- Legacy Feeds -> Publisher -->
    <path d="M 115,360 L 150,360" stroke="#64748b" stroke-width="2" />
    <polygon points="150,360 144,356 144,364" fill="#64748b" />

    <!-- Publisher -> Core Server -->
    <path d="M 230,385 L 275,385 L 275,265 L 325,265" stroke="#34d399" stroke-width="2.5" />
    <polygon points="325,265 317,260 317,270" fill="#34d399" />

    <!-- Core Server -> Web App -->
    <path d="M 565,195 L 710,195" stroke="#38bdf8" stroke-width="2.5" />
    <polygon points="710,195 702,190 702,200" fill="#38bdf8" />

    <!-- Core Server -> AI Agent Core API Boundary -->
    <path d="M 565,265 L 710,265" stroke="#38bdf8" stroke-width="2.5" />
    <polygon points="710,265 702,260 702,270" fill="#38bdf8" />

    <!-- Core Server -> Mobile App -->
    <path d="M 565,335 L 640,335 L 640,415 L 710,415" stroke="#38bdf8" stroke-width="2.5" />
    <polygon points="710,415 702,410 702,420" fill="#38bdf8" />

    <!-- ==================== ECOSYSTEM RE-INTERFACING LINKS ==================== -->
    <!-- Web App &lt;-&gt; Agent Bi-directional Data and Query Interlock -->
    <path d="M 790,225 L 790,245" stroke="#a5f3fc" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="790,225 786,231 794,231" fill="#a5f3fc" />
    <polygon points="790,245 786,239 794,239" fill="#a5f3fc" />

    <!-- Mobile App &lt;-&gt; Agent Bi-directional Data and Query Interlock -->
    <path d="M 790,340 L 790,360" stroke="#a5f3fc" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="790,340 786,346 794,346" fill="#a5f3fc" />
    <polygon points="790,360 786,354 794,354" fill="#a5f3fc" />

    <!-- ==================== HUMAN INTERACTION SURFACE LINKS ==================== -->
    <!-- Web App &lt;-&gt; Human Operator Interface -->
    <path d="M 870,180 L 945,180" stroke="#e2e8f0" stroke-width="1.5" />
    <polygon points="945,180 939,176 939,184" fill="#e2e8f0" />

    <!-- AI Agent &lt;-&gt; Human Direct Conversational Interface -->
    <path d="M 870,280 L 945,260" stroke="#a5f3fc" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="945,260 937,257 941,264" fill="#a5f3fc" />

    <!-- Mobile App &lt;-&gt; Human Tactical User Interface -->
    <path d="M 870,405 L 945,300" stroke="#e2e8f0" stroke-width="1.5" />
    <polygon points="945,300 937,301 942,308" fill="#e2e8f0" />
  </g>

  <!-- INGESTION & SIMULATION NODES -->
  <!-- External Legacy Data Sources -->
  <g transform="translate(45, 310)" filter="url(#shadow)">
    <rect width="70" height="100" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="35" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">LEGACY</text>
    <text x="35" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">FEEDS</text>
    <text x="35" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#64748b" text-anchor="middle">(Non-Standard)</text>
  </g>

  <!-- glaux-publisher (#3) -->
  <g transform="translate(150, 325)" filter="url(#shadow)">
    <rect width="80" height="120" rx="6" fill="url(#comp-grad)" stroke="#10b981" stroke-width="1.5" />
    <rect width="80" height="28" rx="4" fill="#042f2e" opacity="0.6" />
    <text x="40" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="0.5">PUBLISHER</text>
    <text x="40" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">glaux-</text>
